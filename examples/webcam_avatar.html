<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D-Avatar — Live Avatar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0B0E14;color:#F8FAFC;font-family:sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  header{height:48px;background:#151922;border-bottom:1px solid #262C3A;display:flex;align-items:center;padding:0 18px;gap:12px;}
  .logo{font-weight:800;letter-spacing:2px;color:#6366F1;}
  .main{flex:1;display:flex;overflow:hidden;}
  .stage{flex:1;background:radial-gradient(circle at 50% 30%,#161B26 0%,#0B0E14 100%);position:relative;display:flex;align-items:center;justify-content:center;}
  #canvas{display:block;max-width:90vw;max-height:80vh;filter:drop-shadow(0 20px 50px rgba(0,0,0,0.6));}
  .pip{position:absolute;bottom:24px;right:24px;width:220px;height:165px;background:#000;border-radius:12px;overflow:hidden;border:2px solid #262C3A;}
  #pip{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  .controls{position:absolute;bottom:0;left:0;right:0;height:64px;background:#151922;border-top:1px solid #262C3A;display:flex;align-items:center;justify-content:center;gap:12px;}
  .btn{background:#6366F1;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;}
  .btn:hover{background:#4F46E5;}
  .btn.danger{border:1px solid #EF4444;color:#EF4444;background:transparent;}
  .btn.danger:hover{background:#EF4444;color:#fff;}
  .error{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,0.95);color:#fff;padding:12px 20px;border-radius:8px;font-family:sans-serif;z-index:100;display:none;max-width:600px;text-align:center;}
  .error b{display:block;}
  .error .hint{font-size:12px;opacity:0.9;margin-top:6px;}
  .error .close{margin-top:8px;padding:6px 12px;border:none;border-radius:4px;background:#fff;color:#EF4444;cursor:pointer;}
  .status{position:absolute;top:24px;right:24px;display:flex;align-items:center;gap:8px;background:rgba(11,14,20,0.85);border:1px solid #262C3A;border-radius:20px;padding:6px 12px;font-size:12px;z-index:50;}
  .dot{width:10px;height:10px;border-radius:50%;background:#EF4444;box-shadow:0 0 8px #EF4444;}
  .dot.ok{background:#22C55E;box-shadow:0 0 12px #22C55E;}
</style>
</head>
<body>
<header><div class="logo">D-AVATAR LIVE</div></header>
<div class="main">
  <div class="stage">
    <canvas id="canvas"></canvas>
    <video id="webcam" muted playsinline style="display:none;"></video>
    <canvas id="pip" width="220" height="165"></canvas>
  </div>
</div>
<div class="controls">
  <button id="btnCam" class="btn">ATTIVA CAMERA</button>
  <button id="btnTest" class="btn danger">Test Webcam</button>
</div>
<div class="status"><div id="dot" class="dot"></div><span id="statusText">CAM: NON AVVIATA</span></div>
<div class="error" id="errBox">
  <b id="errTitle">Errore</b>
  <div class="hint" id="errHint"></div>
  <button class="close" id="errClose">Chiudi</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('webcam');
const pip = document.getElementById('pip');
const pipCtx = pip.getContext('2d');
const btnCam = document.getElementById('btnCam');
const btnTest = document.getElementById('btnTest');
const errBox = document.getElementById('errBox');
const errTitle = document.getElementById('errTitle');
const errHint = document.getElementById('errHint');
const errClose = document.getElementById('errClose');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');

let stream = null;
let cameraOn = false;
let breathing = 0;

function showError(title, hint) {
  errTitle.textContent = title;
  errHint.textContent = hint;
  errBox.style.display = 'block';
  dot.classList.remove('ok');
  statusText.textContent = 'CAM: ERRORE';
}

function hideError() {
  errBox.style.display = 'none';
}

function setOk() {
  dot.classList.add('ok');
  statusText.textContent = 'CAM: OK';
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth * 0.95, 900);
  const h = Math.min(window.innerHeight * 0.8, 700);
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

async function startCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    stream = s;
    video.srcObject = s;
    await new Promise(r => (video.onloadedmetadata = r));
    video.play();
    cameraOn = true;
    btnCam.textContent = 'SPEGNI CAMERA';
    btnCam.classList.add('danger');
    hideError();
    setOk();
    requestAnimationFrame(tick);
  } catch (e) {
    cameraOn = false;
    showError(
      'Webcam non attivata',
      e.message + '\n\nCosa fare:\n1. Clicca l\'icona lucchetto 🔒 nella barra indirizzi e imposta Fotocamera su Consenti.\n2. Ricarica la pagina.\n3. Usa http://127.0.0.1:8000/webcam_avatar.html (NON doppio clic sul file).\n4. Chiudi altre app che usano la webcam.'
    );
  }
}

async function testCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    s.getTracks().forEach(t => t.stop());
    showError('Webcam FUNZIONA', 'Il permesso è stato concesso. Clicca ATTIVA CAMERA per usarla.');
    dot.classList.add('ok');
    statusText.textContent = 'CAM: OK';
  } catch (e) {
    showError('Webcam NON RAGGIUNGIBILE', e.message);
  }
}

function drawAvatar() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  breathing += 0.02;
  const cx = w / 2;
  const cy = h / 2 + Math.sin(breathing) * 3;

  ctx.clearRect(0, 0, w, h);

  // Testa
  ctx.fillStyle = '#FDBA74';
  ctx.beginPath();
  ctx.arc(cx, cy - 10, 100, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#111827';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Occhi
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(cx - 35, cy - 20, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 35, cy - 20, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#06B6D4';
  ctx.beginPath();
  ctx.arc(cx - 35, cy - 20, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 35, cy - 20, 8, 0, Math.PI * 2);
  ctx.fill();

  // Bocca
  ctx.fillStyle = '#F472B6';
  ctx.beginPath();
  ctx.arc(cx, cy + 20, 20, 0, Math.PI);
  ctx.fill();
}

function tick() {
  if (cameraOn && video.readyState >= 2) {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    ctx.drawImage(video, 0, 0, w, h);
    pipCtx.drawImage(video, 0, 0, pip.width, pip.height);
  } else {
    drawAvatar();
  }
  requestAnimationFrame(tick);
}

btnCam.addEventListener('click', startCamera);
btnTest.addEventListener('click', testCamera);
errClose.addEventListener('click', hideError);

drawAvatar();
requestAnimationFrame(tick);
</script>
</body>
</html>
