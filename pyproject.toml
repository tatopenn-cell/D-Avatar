[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d-avatar"
version = "0.1.0"
description = "Landmark stream to stable avatar parameters to OSC/VMC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dense_armor>=1.7.0,<2",
    "numpy>=1.24",
]

[project.optional-dependencies]
osc = ["python-osc>=1.8"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.25"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.9"]

[project.urls]
Repository = "https://github.com/tatopenn-cell/D-Avatar"

[tool.setuptools.packages.find]
where = ["."]
include = ["d_avatar*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "W", "PL"]
ignore = []

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "D100", "D103"]
"examples/*" = ["S101", "D100"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
follow_imports = "skip"
exclude = ["dense_armor/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
